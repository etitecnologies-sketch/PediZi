# ── App Cliente (pedizi.com.br) ──────────────────
upstream web_upstream {
  server web:3000;
  keepalive 32;
}

# ── Admin (admin.pedizi.com.br) ──────────────────
upstream admin_upstream {
  server admin:3001;
  keepalive 16;
}

# ── Restaurante (restaurante.pedizi.com.br) ───────
upstream restaurant_upstream {
  server restaurant:3002;
  keepalive 16;
}

# ── API (api.pedizi.com.br) ──────────────────────
upstream api_upstream {
  server api:3333;
  keepalive 32;
}

# Redirect HTTP → HTTPS
server {
  listen 80;
  server_name pedizi.com.br www.pedizi.com.br admin.pedizi.com.br restaurante.pedizi.com.br api.pedizi.com.br;

  # Certbot challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# App Cliente
server {
  listen 443 ssl http2;
  server_name pedizi.com.br www.pedizi.com.br;

  ssl_certificate /etc/letsencrypt/live/pedizi.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pedizi.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}

# Admin
server {
  listen 443 ssl http2;
  server_name admin.pedizi.com.br;

  ssl_certificate /etc/letsencrypt/live/pedizi.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pedizi.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Restaurante
server {
  listen 443 ssl http2;
  server_name restaurante.pedizi.com.br;

  ssl_certificate /etc/letsencrypt/live/pedizi.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pedizi.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://restaurant_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# API + WebSocket
server {
  listen 443 ssl http2;
  server_name api.pedizi.com.br;

  ssl_certificate /etc/letsencrypt/live/pedizi.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pedizi.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Rate limit na API
  location /api/v1/auth {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api {
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket (Socket.IO)
  location /socket.io {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400;
  }
}
