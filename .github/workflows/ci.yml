name: CI — PEDIZI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ───────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm exec tsc --noEmit --project apps/api/tsconfig.json || true

  # ── Testes da API ─────────────────────────────────────
  test-api:
    name: Testes API
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pedizi
          POSTGRES_PASSWORD: pedizi123
          POSTGRES_DB: pedizi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        run: pnpm --filter @pedizi/api exec prisma generate
        env:
          DATABASE_URL: postgresql://pedizi:pedizi123@localhost:5432/pedizi_test

      - name: Executar migrations de teste
        run: pnpm --filter @pedizi/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://pedizi:pedizi123@localhost:5432/pedizi_test

      - name: Rodar testes
        run: pnpm --filter @pedizi/api test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://pedizi:pedizi123@localhost:5432/pedizi_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test_jwt_secret_minimo_32_caracteres_aqui
          JWT_REFRESH_SECRET: test_refresh_secret_minimo_32_chars

  # ── Build ─────────────────────────────────────────────
  build:
    name: Build (verificação)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @pedizi/api build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
